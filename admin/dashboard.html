<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>CMS Dashboard | ChauffeurNYC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        .dashboard-card { background: #111; border: 1px solid #222; }
        input, textarea { background: #1a1a1a; border: 1px solid #333; color: #fff; width: 100%; padding: 1rem; border-radius: 0.25rem; outline: none; }
        input:focus, textarea:focus { border-color: #555; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: #666; margin-bottom: 0.5rem; }
        .btn-save { background: #fff; color: #000; font-weight: bold; text-transform: uppercase; letter-spacing: 0.2em; padding: 1rem 2rem; transition: 0.3s; }
        .btn-save:hover { background: #ddd; }
        .logout-btn { color: #666; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-2xl font-bold tracking-widest uppercase">CMS Dashboard</h1>
                <p class="text-xs text-gray-500 tracking-widest mt-1">Phase 1: Content Editor</p>
            </div>
            <button onclick="logout()" class="logout-btn hover:text-white transition-colors">Logout</button>
        </div>

        <div class="dashboard-card p-8 space-y-8">
            <div class="grid md:grid-cols-2 gap-8">
                <div>
                    <label>Phone Number</label>
                    <input type="text" id="phoneNumber" placeholder="+1 (929) 249-2649">
                </div>
                <div>
                    <label>Instagram URL</label>
                    <input type="text" id="instagramUrl" placeholder="https://instagram.com/...">
                </div>
            </div>

            <div>
                <label>Hero Title (Line 1 - Elite)</label>
                <input type="text" id="heroTitleElite" placeholder="The Elite Choice">
            </div>

            <div>
                <label>Hero Title (Line 2 - Location)</label>
                <input type="text" id="heroTitleNY" placeholder="In New York">
            </div>

            <div>
                <label>Hero Description</label>
                <textarea id="heroDescription" rows="4" placeholder="Enter hero description..."></textarea>
            </div>

            <div class="pt-4 border-t border-white/5 flex justify-between items-center">
                <p id="status-msg" class="text-xs tracking-widest text-gray-500"></p>
                <button id="save-btn" class="btn-save">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
