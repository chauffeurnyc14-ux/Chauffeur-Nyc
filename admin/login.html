<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Admin Login | ChauffeurNYC CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Inter', sans-serif; }
        .login-card { background: #111; border: 1px solid #222; }
        input { background: #1a1a1a; border: 1px solid #333; color: #fff; }
        button { background: #fff; color: #000; transition: all 0.3s; }
        button:hover { background: #ccc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="login-card p-8 rounded-lg shadow-2xl w-full max-w-md text-center">
        <h1 class="text-2xl font-bold tracking-widest uppercase mb-8">Admin Access</h1>
        <form id="login-form" class="space-y-6">
            <div class="text-left">
                <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Password</label>
                <input type="password" id="password" required class="w-full p-4 rounded outline-none focus:border-white transition-colors">
            </div>
            <button type="submit" class="w-full py-4 font-bold uppercase tracking-widest text-xs">Login</button>
            <p id="error-msg" class="text-red-500 text-xs hidden">Invalid password</p>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const passInput = document.getElementById('password');
            const pass = passInput.value;
            const errorMsg = document.getElementById('error-msg');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Verifying...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('admin_pass', pass);
                    window.location.href = '/admin/dashboard';
                } else {
                    errorMsg.textContent = data.error || 'Invalid password';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Login';
            }
        });
    </script>
</body>
</html>
